services:

  frontend:
    build: ./Application-Code/frontend
    ports:
      - "5173:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://15.252.162.15:3500/api/tasks
    depends_on:
      - backend

  backend:
    build: ./Application-Code/backend
    ports:
      - "3500:3500"
    environment:
      - mongodb://15.252.162.15:27017/todo
    depends_on:
      - mongodb

  mongodb:
    image: mongo:8
    
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
